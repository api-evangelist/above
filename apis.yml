aid: above
name: Above
description: 'Above (Above Security) is an AI-native insider risk management platform that detects
  and investigates risky human and AI-agent activity across SaaS, identity, and endpoints. Rather than
  flagging statistical anomalies, Above focuses on intent-based insider risk — understanding what a person
  or AI agent was actually trying to do — and assembles investigation-ready narratives from behavioral
  signal without invasive screen or keystroke content capture. Its platform pairs real-time user guidance
  with AI investigative agents to catch data exfiltration, credential leaks, shadow and personal AI use,
  custom GPT risk, and pre-departure flight-risk data theft. Above is the inaugural sponsor of the Forscie
  Insider Threat Matrix and publishes the Insider Risk Index. The company is backed by Norwest Venture
  Partners and was added to the API Evangelist network from that portfolio.'
